# Lab 4 pipeline configuration. Run everything with:  python lab04/pipeline.py
seed: 42

dataset:
  name: adult
  version: 2
  target: class            # OpenML column name for income
  positive_label: ">50K"
  expected_rows: 48842
  expected_cols: 15

split:
  test_size: 0.30
  stratify: true

cleaning:
  clip_lower_pct: 1
  clip_upper_pct: 99
  numeric_impute: median
  categorical_impute: most_frequent
  drop_train_duplicates: true

features:
  derived: [capital_net, hours_per_age]

label_audit:
  sample_size: 50

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: results
  preprocessor: results/preprocessor.joblib

schema:
  missing_token: "?"
  types:
    age: int
    workclass: category
    fnlwgt: int
    education: category
    education-num: int
    marital-status: category
    occupation: category
    relationship: category
    race: category
    sex: category
    capital-gain: int
    capital-loss: int
    hours-per-week: int
    native-country: category
    class: category
  ranges:
    age: [17, 90]
    hours-per-week: [1, 99]
    capital-gain: [0, 99999]
    capital-loss: [0, 4356]
  categories:
    workclass: [Private, Self-emp-not-inc, Self-emp-inc, Federal-gov, Local-gov, State-gov, Without-pay, Never-worked, "?"]
    education: [Preschool, 1st-4th, 5th-6th, 7th-8th, 9th, 10th, 11th, 12th, HS-grad, Some-college, Assoc-voc, Assoc-acdm, Bachelors, Masters, Prof-school, Doctorate, "?"]
    marital-status: [Married-civ-spouse, Divorced, Never-married, Separated, Widowed, Married-spouse-absent, Married-AF-spouse, "?"]
    occupation: [Tech-support, Craft-repair, Other-service, Sales, Exec-managerial, Prof-specialty, Handlers-cleaners, Machine-op-inspct, Adm-clerical, Farming-fishing, Transport-moving, Priv-house-serv, Protective-serv, Armed-Forces, "?"]
    relationship: [Wife, Own-child, Husband, Not-in-family, Other-relative, Unmarried, "?"]
    race: [White, Asian-Pac-Islander, Amer-Indian-Eskimo, Other, Black, "?"]
    sex: [Female, Male, "?"]
    native-country: [United-States, Cambodia, England, Puerto-Rico, Canada, Germany, Outlying-US(Guam-USVI-etc), India, Japan, Greece, South, China, Cuba, Iran, Honduras, Philippines, Italy, Poland, Jamaica, Vietnam, Mexico, Portugal, Ireland, France, Dominican-Republic, Laos, Ecuador, Taiwan, Haiti, Columbia, Hungary, Guatemala, Nicaragua, Scotland, Thailand, Yugoslavia, El-Salvador, Trinadad&Tobago, Peru, Hong, Holand-Netherlands, "?"]
    class: [">50K", "<=50K"]
  # data dictionary: education -> education-num (used in the manual 50-row check)
  education_num:
    Preschool: 1
    1st-4th: 2
    5th-6th: 3
    7th-8th: 4
    9th: 5
    10th: 6
    11th: 7
    12th: 8
    HS-grad: 9
    Some-college: 10
    Assoc-voc: 11
    Assoc-acdm: 12
    Bachelors: 13
    Masters: 14
    Prof-school: 15
    Doctorate: 16
